name: Build and deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11.11
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
          MARIADB_DATABASE: backend_test
          MARIADB_USER: ci_backend
          MARIADB_PASSWORD: ci_backend_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Java instellen
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Bouwen en testen
        run: mvn -B -f backend/pom.xml verify
        env:
          SPRING_DATASOURCE_URL: jdbc:mariadb://127.0.0.1:3306/backend_test
          SPRING_DATASOURCE_USERNAME: ci_backend
          SPRING_DATASOURCE_PASSWORD: ci_backend_password

      - name: GHCR-image naam instellen
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Aanmelden bij GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bouwen en publiceren
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: NAS-container bijwerken
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
          GHCR_USER: ${{ secrets.GHCR_READ_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            /usr/local/bin/docker pull "$IMAGE"
            /usr/local/bin/docker rm -f backend || true
            /usr/local/bin/docker run -d \
              --name backend \
              --restart unless-stopped \
              --env-file /volume1/homes/mike/.env \
              -p 32778:8080 \
              "$IMAGE"